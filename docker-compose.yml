# Local development and manual preview share data. No production resources.
name: ai-shop-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aishop_dev
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Run npm run env:init first}
      POSTGRES_DB: ai_shop_dev
    ports: ["127.0.0.1:55440:5432"]
    volumes: ["dev_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aishop_dev -d ai_shop_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16380:6379"]
    volumes: ["dev_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    profiles: ["preview"]
    image: ${AI_SHOP_CANDIDATE_IMAGE:-ai-shop-candidate:unset}
    pull_policy: never
    command: ["node", "server.js"]
    ports: ["127.0.0.1:3013:3000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://aishop_dev:${DEV_DB_PASSWORD}@postgres:5432/ai_shop_dev
      REDIS_URL: redis://redis:6379/0
      NEXTAUTH_URL: http://127.0.0.1:3013
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3013
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-AI Shop Local}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      AUTH_TRUST_HOST: 'true'
      TRUST_PROXY: 'false'
      SUPPORT_LLM_PROVIDER: ${SUPPORT_LLM_PROVIDER:-sub2api}
      SUPPORT_LLM_BASE_URL: ${SUPPORT_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      SUPPORT_LLM_API_KEY: ${SUPPORT_LLM_API_KEY:-}
      SUPPORT_LLM_MODEL: ${SUPPORT_LLM_MODEL:-gpt-6-luna}
      SUPPORT_LLM_WIRE_API: ${SUPPORT_LLM_WIRE_API:-responses}
      SUPPORT_DAILY_BUDGET_CNY: ${SUPPORT_DAILY_BUDGET_CNY:-}
      SUPPORT_USD_CNY_RATE: ${SUPPORT_USD_CNY_RATE:-}
      SUPPORT_LLM_INPUT_USD_PER_MILLION: ${SUPPORT_LLM_INPUT_USD_PER_MILLION:-}
      SUPPORT_LLM_CACHED_INPUT_USD_PER_MILLION: ${SUPPORT_LLM_CACHED_INPUT_USD_PER_MILLION:-}
      SUPPORT_LLM_CACHE_WRITE_USD_PER_MILLION: ${SUPPORT_LLM_CACHE_WRITE_USD_PER_MILLION:-}
      SUPPORT_LLM_OUTPUT_USD_PER_MILLION: ${SUPPORT_LLM_OUTPUT_USD_PER_MILLION:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ''
      TELEGRAM_BOT_TOKEN: ''
      XUNHU_ALIPAY_APPSECRET: ''
      XUNHU_WECHAT_APPSECRET: ''
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dev_postgres:
  dev_redis:
