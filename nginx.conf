# 日志不记录查询字符串，避免订单查询密码或重置 token 写入访问日志。
log_format shop_safe '$remote_addr - $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=shop_requests:10m rate=20r/s;

# 上游服务
upstream ai-shop {
    server app:3000;
    keepalive 64;
}

# HTTP 服务（Cloudflare 处理 SSL）
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log shop_safe;
    limit_req zone=shop_requests burst=40 nodelay;
    limit_req_status 429;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 客户端上传大小限制
    client_max_body_size 10M;

    # 代理到 Next.js
    location / {
        proxy_pass http://ai-shop;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # 静态资源缓存
    location /_next/static {
        proxy_pass http://ai-shop;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /static {
        proxy_pass http://ai-shop;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000";
    }
}
