# Explicit production only: scripts/release.mjs selects immutable images.
name: ai-shop
services:
  # Next.js 应用
  app:
    image: ${AI_SHOP_APP_IMAGE:?Use the explicit production release command}
    pull_policy: never
    command: ["node", "server.js"]
    container_name: ai-shop-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://aishop:${DB_PASSWORD}@postgres:5432/ai_shop?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - TRUST_PROXY=true
      - MAX_PENDING_ORDERS=${MAX_PENDING_ORDERS:-3}
      - MAX_PENDING_QUANTITY=${MAX_PENDING_QUANTITY:-100}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # 支付配置 - 虎皮椒
      - XUNHU_GATEWAY=${XUNHU_GATEWAY}
      - XUNHU_WECHAT_APPID=${XUNHU_WECHAT_APPID}
      - XUNHU_WECHAT_APPSECRET=${XUNHU_WECHAT_APPSECRET}
      - XUNHU_ALIPAY_APPID=${XUNHU_ALIPAY_APPID}
      - XUNHU_ALIPAY_APPSECRET=${XUNHU_ALIPAY_APPSECRET}
      # USDT 支付
      - USDT_TRC20_ADDRESS=${USDT_TRC20_ADDRESS}
      - TRONGRID_API_KEY=${TRONGRID_API_KEY}
      # 通知配置
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # 邮件配置
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      # 其他配置
      - USDT_EXCHANGE_RATE=${USDT_EXCHANGE_RATE}
      - CRON_SECRET=${CRON_SECRET}
      # Cloudinary 图片存储
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SUPPORT_LLM_PROVIDER=${SUPPORT_LLM_PROVIDER:-sub2api}
      - SUPPORT_LLM_BASE_URL=${SUPPORT_LLM_BASE_URL}
      - SUPPORT_LLM_API_KEY=${SUPPORT_LLM_API_KEY}
      - SUPPORT_LLM_MODEL=${SUPPORT_LLM_MODEL:-gpt-6-luna}
      - SUPPORT_LLM_WIRE_API=${SUPPORT_LLM_WIRE_API:-responses}
      - SUPPORT_DAILY_BUDGET_CNY=${SUPPORT_DAILY_BUDGET_CNY:-10}
      - SUPPORT_USD_CNY_RATE=${SUPPORT_USD_CNY_RATE:-7.2}
      - SUPPORT_LLM_INPUT_USD_PER_MILLION=${SUPPORT_LLM_INPUT_USD_PER_MILLION:-0.1}
      - SUPPORT_LLM_CACHED_INPUT_USD_PER_MILLION=${SUPPORT_LLM_CACHED_INPUT_USD_PER_MILLION:-0.01}
      - SUPPORT_LLM_CACHE_WRITE_USD_PER_MILLION=${SUPPORT_LLM_CACHE_WRITE_USD_PER_MILLION:-0.125}
      - SUPPORT_LLM_OUTPUT_USD_PER_MILLION=${SUPPORT_LLM_OUTPUT_USD_PER_MILLION:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai-shop-network

  # PostgreSQL 数据库
  postgres:
    image: ${AI_SHOP_POSTGRES_IMAGE:?Pin the existing PostgreSQL image}
    container_name: ai-shop-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aishop
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ai_shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aishop -d ai_shop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-shop-network

  # Redis 缓存
  redis:
    image: ${AI_SHOP_REDIS_IMAGE:?Pin the existing Redis image}
    container_name: ai-shop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai-shop-network

  # Nginx 反向代理
  nginx:
    image: ${AI_SHOP_NGINX_IMAGE:?Pin the existing Nginx image}
    container_name: ai-shop-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    volumes:
      - ./.deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ai-shop-network

volumes:
  postgres_data:
    external: true
    name: ai-shop_postgres_data
  redis_data:
    external: true
    name: ai-shop_redis_data

networks:
  ai-shop-network:
    driver: bridge
