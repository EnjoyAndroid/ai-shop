# 本机部署：docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# .env 中的数据库地址用于本机 Prisma CLI；容器仍通过内部网络连接数据库。
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:55439:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  nginx:
    image: nginx:latest
    # 本机 Tunnel 部署可选择专用代理配置；默认仍使用普通本地配置。
    volumes:
      - "${LOCAL_NGINX_CONFIG:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro"
    ports: !override
      - "127.0.0.1:3010:80"
