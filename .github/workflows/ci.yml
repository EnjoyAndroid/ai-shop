name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aishop
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ai_shop_security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aishop -d ai_shop_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://aishop:ci-test-only@localhost:5432/ai_shop_security_test
      TEST_DATABASE_URL: postgresql://aishop:ci-test-only@localhost:5432/ai_shop_security_test
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral build secrets
        run: |
          node -e 'const fs=require("fs"), c=require("crypto"); for(const key of ["NEXTAUTH_SECRET","ENCRYPTION_KEY"]) fs.appendFileSync(process.env.GITHUB_ENV, key+"="+c.randomBytes(32).toString("hex")+"\n");'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check:secrets
      - run: npm run check:history
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:http
      - run: npm run audit:security
